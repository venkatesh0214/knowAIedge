name: Mobile builds
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test mobile/tests/*.test.cjs
      - name: Check the mobile reader in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/reader-qa" --no-audit --no-fund --ignore-scripts playwright-core@1.58.2
          KNOW_PLAYWRIGHT="$RUNNER_TEMP/reader-qa/node_modules/playwright-core" KNOW_CHROME="$(command -v google-chrome)" node mobile/tests/browser.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: knowAIedge-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check production feed contracts
        continue-on-error: true
        run: node mobile/tests/live-feeds.cjs
  ios:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS Simulator app
        working-directory: mobile/ios
        run: |
          xcodebuild -project KnowAIedge.xcodeproj -scheme KnowAIedge -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/reader-build" CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent "$RUNNER_TEMP/reader-build/Build/Products/Debug-iphonesimulator/KnowAIedge.app" "$RUNNER_TEMP/knowAIedge-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: knowAIedge-ios-simulator
          path: ${{ runner.temp }}/knowAIedge-simulator.zip
          if-no-files-found: error
      - name: Launch the reader on an iPhone simulator
        run: bash mobile/tests/ios-smoke.sh "$RUNNER_TEMP/reader-build/Build/Products/Debug-iphonesimulator/KnowAIedge.app"
